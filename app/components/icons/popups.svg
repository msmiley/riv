<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Larger background dialog -->
  <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" fill="none" />
  <!-- Foreground smaller dialog for popup effect -->
  <rect x="7" y="7" width="10" height="10" rx="1" stroke="currentColor" fill="none" />
  <!-- Header line in foreground dialog -->
  <line x1="9" y1="11" x2="15" y2="11" stroke="currentColor" />
  <!-- Body line in foreground dialog -->
  <line x1="9" y1="14" x2="15" y2="14" stroke="currentColor" />
</svg>
